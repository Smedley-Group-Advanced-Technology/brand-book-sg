<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smedley Group mark</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* The hero: the mark's three bars draw in white on the signature surface, one after another, then the lockup settles
   below. One surface, one light source, one moment. Every frame is CSS; the script only runs the two buttons. */
:root{--u:min(1vw,1.6vh);--ground:#F0F0F0;--ink:#000;--dim:#333F50;--rule:#ABC0E4;--btn:#D6DCE5;--brake:cubic-bezier(.16,1,.3,1);color-scheme:light}
:root[data-theme="dark"]{--ground:#10141A;--ink:#fff;--dim:#D6DCE5;--rule:rgba(171,192,228,.28);--btn:rgba(171,192,228,.14);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ground);color:var(--ink);font-family:"Sora",system-ui,sans-serif;overflow:hidden}
:root[data-embed="cover"],:root[data-embed="cover"] body{background:transparent !important}
main{position:relative;height:100%;display:grid;place-items:center}
/* on the cover the title holds the left; the mark sits in the right half */
:root[data-embed="cover"] main{justify-items:end;padding-right:12vw;padding-top:6vh}
.stage{display:grid;justify-items:center;gap:calc(var(--u)*5.5)}
/* the tile: the 45 degree gradient inside its edge light, Mist at the top, Pale Blue at 53 %, Slate at the foot */
.tile{position:relative;display:grid;place-items:center;width:calc(var(--u)*24);aspect-ratio:49/51;border:1px solid transparent;border-radius:calc(var(--u)*3.6);
  background:linear-gradient(135deg,#000 0%,#222A35 100%) padding-box,linear-gradient(180deg,#8497B0 0%,#ABC0E4 53%,#333F50 100%) border-box}
.tile svg{width:calc(var(--u)*10.5);height:auto;overflow:visible}
.tile line{stroke:#fff;stroke-width:14.2;stroke-dasharray:48;stroke-dashoffset:0}
.lock{display:flex;align-items:center;gap:calc(var(--u)*1.6);font-weight:600;font-size:calc(var(--u)*2.1);line-height:1.12;letter-spacing:-.01em}
.lock i{width:2px;align-self:stretch;background:currentColor}
.rule{width:calc(var(--u)*34);height:1px;background:linear-gradient(90deg,var(--rule) 0 83%,transparent)}
/* the moment: bars in turn, the lockup after them, the divider last */
.play .tile{animation:tileIn .9s var(--brake) both}
.play .tile line{animation:draw .9s var(--brake) both}
.play .tile line:nth-child(1){animation-delay:.35s}
.play .tile line:nth-child(2){animation-delay:.55s}
.play .tile line:nth-child(3){animation-delay:.75s}
.play .lock{animation:rise .8s var(--brake) 1.2s both}
.play .rule{animation:grow 1s var(--brake) 1.5s both;transform-origin:0 50%}
@keyframes tileIn{from{opacity:0;transform:translateY(calc(var(--u)*2)) scale(.96)}}
@keyframes draw{from{stroke-dashoffset:48}}
@keyframes rise{from{opacity:0;transform:translateY(calc(var(--u)*1.5))}}
@keyframes grow{from{transform:scaleX(0)}}
@media (prefers-reduced-motion: reduce){.play .tile,.play .tile line,.play .lock,.play .rule{animation:none !important}}
/* the controls: secondary buttons, rounded, in the page's quiet tint */
.controls{position:absolute;right:calc(var(--u)*3);bottom:calc(var(--u)*3);display:flex;gap:8px}
button{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border:0;border-radius:8px;background:var(--btn);color:var(--ink);font:600 13px "Sora",system-ui,sans-serif;cursor:pointer;transition:transform .08s ease-out}
button:active{transform:scale(.98)}
button:focus-visible{outline:2px solid #44546A;outline-offset:2px}
:root[data-theme="dark"] button:focus-visible{outline-color:#ABC0E4}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .45s var(--brake)}
#replay:hover .ic{transform:rotate(-120deg)}
.controls .moon{display:none} :root[data-theme="dark"] .controls .sun{display:none} :root[data-theme="dark"] .controls .moon{display:block}
@media (prefers-reduced-motion: reduce){.ic,button{transition:none}}
</style>
</head>
<body>
<main>
  <div class="stage play" id="stage" role="img" aria-label="The Smedley Group mark: three white bars on the signature surface, above the Smedley Group, Advanced Technology lockup">
    <div class="tile"><svg viewBox="-0.9 -1 56 86" aria-hidden="true"><line x1="21.31" y1="2.59" x2="48.89" y2="41.71"/><line x1="6.71" y1="12.79" x2="47.59" y2="71.21"/><line x1="5.51" y1="42.39" x2="32.89" y2="81.41"/></svg></div>
    <div class="lock" aria-hidden="true"><span>Smedley<br>Group</span><i></i><span>Advanced<br>Technology</span></div>
    <div class="rule" aria-hidden="true"></div>
  </div>
  <div class="controls">
    <button id="theme" type="button"><svg class="ic sun" viewBox="0 0 24 24" aria-hidden="true" data-icon="sun"><circle cx="12" cy="12" r="4"/><path d="M12 2.5V4.5M12 19.5V21.5M2.5 12H4.5M19.5 12H21.5M5.3 5.3L6.7 6.7M17.3 17.3L18.7 18.7M5.3 18.7L6.7 17.3M17.3 6.7L18.7 5.3"/></svg><svg class="ic moon" viewBox="0 0 24 24" aria-hidden="true" data-icon="moon"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg><span class="tx">Dark</span></button>
    <button id="replay" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" data-icon="replay"><path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.5"/><path d="M4 4V8.5H8.5"/></svg><span class="tx">Replay</span></button>
  </div>
</main>
<script>
  // only the buttons use script; every frame of the hero is CSS
  var stage=document.getElementById('stage'), root=document.documentElement, tb=document.getElementById('theme');
  document.getElementById('replay').addEventListener('click',function(){stage.classList.remove('play');void stage.offsetWidth;stage.classList.add('play')});
  function dark(){return root.getAttribute('data-theme')==='dark'}
  function label(){tb.querySelector('.tx').textContent=dark()?'Light':'Dark'} label();
  tb.addEventListener('click',function(){root.setAttribute('data-theme',dark()?'light':'dark');label()});
</script>
</body>
</html>
