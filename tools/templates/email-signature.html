<!-- Smedley Group email signature.
     1. Replace the words in brackets.
     2. For a business, swap the image address and width for its lockup:
{{variants}}
     3. Open this file in a browser, select everything, copy, and paste it into your mail client's signature settings.
     FAT Karting League staff use the FKL signature, not this one. -->
<table cellpadding="0" cellspacing="0" border="0" role="presentation" style="font-family:Sora,Arial,Helvetica,sans-serif;color:#0B0C0E;border-collapse:collapse">
  <tr><td style="padding:0 0 4px 0;font-size:14px;line-height:20px;font-weight:600">[First Last]</td></tr>
  <tr><td style="padding:0 0 12px 0;font-size:12px;line-height:18px;color:#585D65">[Role], [Business]</td></tr>
  <tr><td style="padding:0 0 12px 0;border-top:1px solid #1F66E0"><table cellpadding="0" cellspacing="0" border="0" role="presentation"><tr><td style="width:36px;height:3px;background:#D8231A;font-size:0;line-height:0">&nbsp;</td></tr></table></td></tr>
  <tr><td style="padding:0 0 14px 0;font-family:'IBM Plex Mono','Courier New',monospace;font-size:11px;line-height:17px;color:#585D65">[+44 0000 000000]<br><a href="mailto:[name]@smedleygroup.com" style="color:#1F66E0;text-decoration:none">[name]@smedleygroup.com</a></td></tr>
  <tr><td><img src="{{base}}signature-lockup.png" width="113" height="49" alt="Smedley Group" style="display:block;border:0;width:113px;height:49px"></td></tr>
</table>
